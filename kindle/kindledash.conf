# KindleDash: startet nach dem Hochfahren den Dienst und das Dashboard.
# Liegt in /etc/upstart, eingespielt von installieren.sh.
# Abschalten: leere Datei /mnt/us/kindledash/KEIN_AUTOSTART anlegen.

start on framework_ready
stop on stopping framework

script
    [ -f /mnt/us/kindledash/KEIN_AUTOSTART ] && exit 0
    [ -f /mnt/us/kindledash/dienst.sh ] || exit 0
    exec /bin/sh /mnt/us/kindledash/dienst.sh --boot
end script
