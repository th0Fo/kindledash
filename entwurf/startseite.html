<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Startseite Entwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Paperwhite 3: 1072 x 1448 px, 300 ppi, 16 Graustufen */
  :root {
    --papier: #ffffff;
    --tinte: #000000;
    --tinte-2: #3a3a3a;
    --tinte-3: #6e6e6e;
    --linie: #b4b4b4;
    --flaeche: #e4e4e4;

    --schrift: "Barlow", sans-serif;
    --zahl: "Barlow Semi Condensed", "Barlow", sans-serif;

    --s-1: 24px;
    --s-2: 30px;
    --s-3: 38px;
    --s-4: 52px;
    --s-5: 84px;
    --s-6: 140px;
    --s-7: 236px;

    --rand: 56px;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #9a9a9a; }
  .kindle {
    width: 1072px; height: 1448px; margin: 0 auto;
    background: var(--papier); color: var(--tinte);
    font-family: var(--schrift); font-variant-numeric: tabular-nums;
    padding: 44px var(--rand) 48px;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    overflow: hidden; position: relative;
  }
  .kopf {
    display: flex; align-items: center; justify-content: space-between;
    font-size: var(--s-2); color: var(--tinte-2); height: 56px;
  }
  .kopf .datum { font-weight: 600; color: var(--tinte); font-size: var(--s-3); }
  .kopf .rechts { display: flex; align-items: center; gap: 28px; }
  .status { display: flex; align-items: center; gap: 10px; }
  .status svg { width: 30px; height: 30px; }
  .zahnrad { width: 40px; height: 40px; color: var(--tinte-2); }

  /* Netzausfall: der Kopf wird schwarz, damit es aus der Entfernung auffällt */
  .netzausfall .kopf {
    background: var(--tinte); color: var(--papier);
    margin: -44px calc(-1 * var(--rand)) 0; padding: 40px var(--rand) 24px; height: auto;
  }
  .netzausfall .kopf .datum, .netzausfall .kopf .zahnrad { color: var(--papier); }
  .netzausfall .kopf .status { font-weight: 600; }

  /* Hauptwerte */
  .haupt {
    display: grid; grid-template-columns: 1.15fr 1fr; column-gap: 48px;
    padding: 28px 0 36px; border-bottom: 3px solid var(--tinte);
  }
  .label { font-size: var(--s-2); color: var(--tinte-3); font-weight: 500; letter-spacing: .02em; }
  .akku .wert { font-family: var(--zahl); font-weight: 600; font-size: var(--s-7); line-height: .86; letter-spacing: -.02em; margin-top: 14px; }
  .akku .wert span { font-size: var(--s-6); margin-left: 6px; }
  .zellen { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 34px; height: 40px; }
  .zellen i { border: 3px solid var(--tinte); border-radius: 4px; }
  .zellen i.voll { background: var(--tinte); }
  .zellen i.halb { background: linear-gradient(90deg, var(--tinte) 50%, transparent 50%); }
  .akku .richtung { margin-top: 22px; font-size: var(--s-3); display: flex; align-items: center; gap: 12px; }
  .akku .richtung svg { width: 34px; height: 34px; }

  .fluss { display: grid; grid-template-rows: 1fr 1fr; row-gap: 26px; align-content: stretch; }
  .fluss > div { border-left: 3px solid var(--linie); padding-left: 32px; }
  .fluss .wert { font-family: var(--zahl); font-weight: 600; font-size: var(--s-6); line-height: .95; margin-top: 8px; }
  .fluss .wert span { font-size: var(--s-4); margin-left: 8px; color: var(--tinte-2); }

  /* Heute */
  .heute { display: grid; grid-template-columns: 330px 1fr; column-gap: 40px; padding: 32px 0 28px; border-bottom: 2px solid var(--linie); }
  .wetter-jetzt .zeile { display: flex; align-items: center; gap: 18px; margin-top: 10px; }
  .wetter-jetzt svg { width: 120px; height: 120px; }
  .wetter-jetzt .temp { font-family: var(--zahl); font-size: var(--s-6); font-weight: 600; line-height: 1; }
  .wetter-jetzt .text { font-size: var(--s-2); color: var(--tinte-2); margin-top: 14px; line-height: 1.35; }
  .prognose .kopfzeile { display: flex; align-items: baseline; justify-content: space-between; }
  .prognose .kwh { font-family: var(--zahl); font-size: var(--s-5); font-weight: 600; line-height: 1; margin-top: 6px; }
  .prognose .kwh span { font-size: var(--s-3); margin-left: 6px; }
  .prognose .anteil { font-size: var(--s-2); color: var(--tinte-2); text-align: right; line-height: 1.3; }
  .prognose .anteil b { font-family: var(--zahl); font-size: var(--s-4); color: var(--tinte); font-weight: 600; display: block; }
  .kurve { margin-top: 18px; width: 100%; height: 190px; display: block; }
  .kurve text { font-family: var(--schrift); font-size: 22px; fill: var(--tinte-3); }

  /* 7 Tage */
  .woche-kopf { display: flex; justify-content: space-between; padding-top: 26px; }
  .woche { display: grid; grid-template-columns: repeat(7, 1fr); padding-top: 18px; }
  .tag { text-align: center; display: grid; grid-template-rows: auto auto auto 1fr auto; justify-items: center; border-left: 2px solid var(--flaeche); }
  .tag:first-child { border-left: 0; }
  .tag .name { font-size: var(--s-2); font-weight: 600; }
  .tag.heute-tag .name { background: var(--tinte); color: var(--papier); border-radius: 6px; padding: 0 12px; }
  .tag svg { width: 66px; height: 66px; margin: 14px 0 8px; }
  .tag .t { font-family: var(--zahl); font-size: var(--s-2); font-weight: 600; }
  .tag .t span { color: var(--tinte-3); font-weight: 500; margin-left: 6px; }
  .tag .saeule { width: 40px; height: 118px; margin-top: 16px; display: flex; align-items: flex-end; background: var(--flaeche); border-radius: 4px; overflow: hidden; }
  .tag .saeule i { display: block; width: 100%; background: var(--tinte-2); }
  .tag .e { font-family: var(--zahl); font-size: var(--s-2); font-weight: 600; margin-top: 10px; }

  /* Zustand: keine Verbindung */
  .kopf > * { white-space: nowrap; }
  .getrennt { display: none; }
  .offline .haupt > .akku, .offline .haupt > .fluss { display: none; }
  .offline .haupt { grid-template-columns: 1fr; }
  .offline .getrennt { display: grid; align-content: center; gap: 18px; min-height: 420px; }
  .getrennt svg { width: 96px; height: 96px; }
  .getrennt .gross { font-size: var(--s-5); font-weight: 600; line-height: 1.05; }
  .getrennt .klein { font-size: var(--s-3); color: var(--tinte-2); }

  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .zustaende { position: fixed; top: 12px; left: 12px; font: 14px sans-serif; }
  .zustaende a { color: #000; background: #fff; padding: 4px 8px; margin-right: 4px; text-decoration: none; }
</style>
</head>
<body>
<nav class="zustaende"><a href="#normal">normal</a><a href="#netzausfall">netzausfall</a><a href="#offline">offline</a></nav>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="sonne" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="wolke" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="sonne-wolke" viewBox="0 0 24 24"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></symbol>
    <symbol id="regen" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M16 14v6M8 14v6M12 16v6"/></symbol>
    <symbol id="niesel" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M8 19v1M8 14v1M16 19v1M16 14v1M12 21v1M12 16v1"/></symbol>
    <symbol id="stecker" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8Z"/></symbol>
    <symbol id="stecker-aus" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8ZM2 2l20 20"/></symbol>
    <symbol id="wlan-aus" viewBox="0 0 24 24"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20"/></symbol>
    <symbol id="pfeil-hoch" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="zahnrad" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  </defs>
</svg>

<main class="kindle" id="kindle">
  <header class="kopf">
    <div class="datum">Sonntag, 25. Oktober</div>
    <div class="rechts">
      <div class="status" id="status"><svg class="i"><use href="#stecker"/></svg><span>Netz da</span></div>
      <div id="stand">Stand 14:32</div>
      <svg class="i zahnrad"><use href="#zahnrad"/></svg>
    </div>
  </header>

  <section class="haupt">
    <div class="akku">
      <div class="label">Batterie</div>
      <div class="wert">78<span>%</span></div>
      <div class="zellen"><i class="voll"></i><i class="voll"></i><i class="voll"></i><i class="voll"></i><i class="voll"></i><i class="voll"></i><i class="voll"></i><i class="halb"></i><i></i><i></i></div>
      <div class="richtung"><svg class="i"><use href="#pfeil-hoch"/></svg>lädt mit 120 W</div>
    </div>
    <div class="fluss">
      <div><div class="label">Sonne</div><div class="wert">420<span>W</span></div></div>
      <div><div class="label">Haus</div><div class="wert">290<span>W</span></div></div>
    </div>
    <div class="getrennt">
      <svg class="i"><use href="#wlan-aus"/></svg>
      <div class="gross">Keine Verbindung<br>zur Anlage</div>
      <div class="klein">letzte Werte um 14:12</div>
    </div>
  </section>

  <section class="heute">
    <div class="wetter-jetzt">
      <div class="label">Wetter Hamm</div>
      <div class="zeile"><svg class="i"><use href="#sonne-wolke"/></svg><div class="temp">13°</div></div>
      <div class="text">heiter bis wolkig<br>7° bis 14°, trocken</div>
    </div>
    <div class="prognose">
      <div class="kopfzeile">
        <div>
          <div class="label">Sonnenstrom heute</div>
          <div class="kwh">3,1<span>kWh</span></div>
        </div>
        <div class="anteil"><b>65 %</b>einer Batterieladung</div>
      </div>
      <svg class="kurve" id="kurve" viewBox="0 0 560 190" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section>
    <div class="woche-kopf"><span class="label">7 Tage</span><span class="label">Sonnenstrom in kWh</span></div>
    <div class="woche" id="woche"></div>
  </section>
</main>

<script>
  // Beispielwerte, später vom GX und von Open-Meteo
  const tage = [
    ["So", "sonne-wolke", 14, 7, 3.1],
    ["Mo", "regen", 11, 6, 0.9],
    ["Di", "wolke", 10, 5, 1.4],
    ["Mi", "sonne", 12, 3, 3.6],
    ["Do", "sonne-wolke", 13, 5, 2.7],
    ["Fr", "niesel", 11, 7, 1.1],
    ["Sa", "regen", 9, 6, 0.7],
  ];
  const max = 4.8;
  document.getElementById("woche").innerHTML = tage.map(([n, i, hi, lo, e], k) => `
    <div class="tag${k === 0 ? " heute-tag" : ""}">
      <div class="name">${n}</div>
      <svg class="i"><use href="#${i}"/></svg>
      <div class="t">${hi}°<span>${lo}°</span></div>
      <div class="saeule"><i style="height:${Math.round(e / max * 100)}%"></i></div>
      <div class="e">${e.toFixed(1).replace(".", ",")}</div>
    </div>`).join("");

  // Tageskurve: erwartete Leistung als Fläche, gemessene als Linie bis jetzt
  const W = 560, H = 190, unten = 158, von = 7, bis = 18, spitze = 640;
  const x = h => (h - von) / (bis - von) * W;
  const y = w => unten - w / spitze * (unten - 8);
  const erwartet = h => 560 * Math.exp(-((h - 12.5) ** 2) / (2 * 2.2 ** 2));
  let flaeche = `M0 ${unten}`, linie = "";
  for (let h = von; h <= bis + 1e-9; h += 0.25) flaeche += ` L${x(h).toFixed(1)} ${y(erwartet(h)).toFixed(1)}`;
  flaeche += ` L${W} ${unten} Z`;
  let s = 3;
  for (let h = von; h <= 14.53; h += 0.25) {
    s = (s * 9301 + 49297) % 233280;
    const w = erwartet(h) * (0.9 + 0.16 * s / 233280);
    linie += `${linie ? " L" : "M"}${x(h).toFixed(1)} ${y(w).toFixed(1)}`;
  }
  const jetzt = x(14.53);
  const achse = [8, 10, 12, 14, 16, 18].map(h =>
    `<text x="${x(h)}" y="186" text-anchor="${h === 18 ? "end" : "middle"}">${h}</text>`).join("");
  document.getElementById("kurve").innerHTML = `
    <path d="${flaeche}" fill="#e4e4e4"/>
    <line x1="0" y1="${unten}" x2="${W}" y2="${unten}" stroke="#6e6e6e" stroke-width="2"/>
    <path d="${linie}" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <line x1="${jetzt}" y1="8" x2="${jetzt}" y2="${unten}" stroke="#000" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="${jetzt}" cy="${y(420)}" r="7" fill="#000"/>
    ${achse}`;

  function zustand() {
    const z = location.hash.slice(1) || "normal";
    const k = document.getElementById("kindle");
    k.className = "kindle " + z;
    const st = document.getElementById("status");
    if (z === "netzausfall") {
      st.innerHTML = '<svg class="i"><use href="#stecker-aus"/></svg><span>Netzausfall seit 14:05</span>';
    } else if (z === "offline") {
      st.innerHTML = '<svg class="i"><use href="#wlan-aus"/></svg><span>keine Verbindung</span>';
      document.getElementById("stand").textContent = "Stand 14:32";
    } else {
      st.innerHTML = '<svg class="i"><use href="#stecker"/></svg><span>Netz da</span>';
      document.getElementById("stand").textContent = "Stand 14:32";
      document.querySelector(".richtung").innerHTML = '<svg class="i"><use href="#pfeil-hoch"/></svg>lädt mit 120 W';
    }
  }
  addEventListener("hashchange", zustand);
  zustand();
</script>
</body>
</html>
